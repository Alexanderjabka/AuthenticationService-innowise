databaseChangeLog:
  - changeSet:
      id: 002-create-users-table
      author: io.github.Alexanderjabka
      changes:
        - createTable:
            schemaName: user_schema
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: email
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: salt
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
