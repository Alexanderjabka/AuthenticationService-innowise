server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/authdb
    username: auth_user
    password: authpass

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: user_schema

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yml
